name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,spoof]"
      - run: ruff check .
      - run: mypy echoguard
      - run: pytest -q
      - name: benchmarks regenerate their published numbers
        run: |
          python benchmark/corpus.py /tmp/benign
          python benchmark/evaluate.py /tmp/benign | tee /tmp/eval.txt
          grep -q "false-positive rate: 0%" /tmp/eval.txt
          python benchmark/synth_attacks.py --evaluate --out /tmp/synth | tee /tmp/synth.txt
          grep -q "12/12   false alarms (benign flagged): 0/12" /tmp/synth.txt
